{% extends "base.html" %}

{% block title %}Register - Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-3">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h4 class="fw-bold">Create an Account</h4>
                    <p class="text-muted small">Start managing your personal finances with AI guidance</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label small fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name or '' }}" required placeholder="e.g. Rahul Sharma">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" minlength="6" required placeholder="Min 6 characters">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="confirm_password" class="form-label small fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required placeholder="Re-enter password">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="monthly_income" class="form-label small fw-semibold">Est. Monthly Income (₹)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-cash"></i></span>
                                <input type="number" step="0.01" class="form-control" id="monthly_income" name="monthly_income" placeholder="e.g. 50000">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="preferred_currency" class="form-label small fw-semibold">Currency</label>
                            <select class="form-select" id="preferred_currency" name="preferred_currency">
                                <option value="INR" selected>INR (₹)</option>
                                <option value="USD">USD ($)</option>
                                <option value="EUR">EUR (€)</option>
                                <option value="GBP">GBP (£)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-text text-muted mb-3 small">
                        <i class="bi bi-shield-check text-success me-1"></i> Passwords are salted and hashed securely with Werkzeug.
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check-lg me-1"></i> Complete Registration
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center small">
                    Already have an account? 
                    <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
